services:

  # ============================================================
  # VIRTUOSO — Knowledge Graph persistant
  # ============================================================
  virtuoso:
    image: openlink/virtuoso-opensource-7:latest
    container_name: virtuoso-db
    ports:
      - "8890:8890"
      - "1111:1111"
    environment:
      DBA_PASSWORD: dba
      SPARQL_UPDATE: "true"
      DEFAULT_GRAPH: http://example.org/fraude
    volumes:
      - ./virtuoso_data:/database
      - ./ontologies:/import
    restart: unless-stopped

  # ============================================================
  # KAFKA — Courtier de messages (mode KRaft)
  # ============================================================
  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka-fraude
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-fraude:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-fraude:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_fraude_data:/var/lib/kafka/data
    restart: unless-stopped

  # ============================================================
  # KAFKA UI — Interface web d'administration
  # ============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-fraude-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fraude-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-fraude:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka
    restart: unless-stopped

volumes:
  kafka_fraude_data: